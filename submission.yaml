# =============================================================================
# HACKATHON SUBMISSION METADATA
# =============================================================================
# Instructions:
#   - Fill in ALL required fields (marked with # REQUIRED)
#   - Optional fields can be left as empty strings ""
#   - Do NOT rename this file — the evaluation pipeline reads it by name
#   - Use double quotes around all string values
# =============================================================================

team:
  name: "The Atreides"                 # REQUIRED — e.g., "Orion Squad"
  track: "AI"                          # REQUIRED — one of: AI | DevOps | Sustainability | Open
  lead:
    name: "Lead Name"                  # REQUIRED — e.g., "Alice Chen"
    email: "lead@example.com"          # REQUIRED — e.g., "alice.chen@ibm.com"
  members:
    - name: "Member One"               # REQUIRED — Team member 1
      email: "member1@example.com"
    - name: "Member Two"               # Add more members by copying the two lines above
      email: "member2@example.com"

submission:
  title: "Atreides Food Recommendation System"  # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Users struggle to find personalized food recommendations that align with their specific dietary needs and preferences. This leads to decision fatigue and poor nutritional choices.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We built an ML-powered food recommendation engine that uses watsonx.ai to analyze user preferences and generate highly personalized meal suggestions. The system learns from feedback to continuously improve its accuracy.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Personalized meal recommendations based on user profiles"
    - "Natural language interaction using IBM Bob"
    - "Real-time dietary restriction filtering"
    - "Nutritional analysis powered by watsonx.ai"

  tech_stack:
    languages: ["Python", "JavaScript"] # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React"]    # e.g., ["FastAPI", "React"]
    ibm_technologies: ["watsonx.ai", "IBM Bob"] # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["PostgreSQL"]           # e.g., ["PostgreSQL", "Redis"]
    other: ["Docker"]                   # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We are most proud of the seamless integration with watsonx.ai, which allows for complex reasoning over user dietary constraints in real-time.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The current database of recipes is limited to North American cuisine and requires expansion.

# =============================================================================
# ARTIFACT LOCATIONS
# These paths are relative to the repo root. Only change if you moved files.
# =============================================================================
artifacts:
  source_code: "src/"
  setup_guide: "docs/setup-guide.md"
  architecture_doc: "docs/architecture.md"
  demo_video: "demo/demo-video-link.txt"   # URL to hosted video (YouTube, Loom, Box)
  live_demo: "demo/live-demo-url.txt"      # URL to deployed demo (optional)
  screenshots: "demo/screenshots/"
  presentation: "presentation/"
